version: '2'

# 挂载用相对路径（相对本 compose 文件所在目录），解包到任意目录都能起；
# 容器内路径固定是 /root/bin、/root/etc，command 引用它们。
# network_mode: host 下服务直接占用宿主端口（sync 20003、jrpc 9993），不需要 ports 映射
# （写了会被 docker 忽略并告警 "Published ports are discarded when using host network mode"）。
services:
  sync:
    container_name: externaldb-sync
    image: docker.io/ubuntu:16.04 
    volumes:
      - "./bin/:/root/bin/"
      - "./etc/:/root/etc/"
    network_mode: "host"
    command: /root/bin/sync -f /root/etc/externaldb.toml &

  convert:
    container_name: externaldb-convert
    image: docker.io/ubuntu:16.04 
    depends_on:
      - sync
    volumes:
      - "./bin/:/root/bin/"
      - "./etc/:/root/etc/"
    network_mode: "host"
    command: /root/bin/convert -f /root/etc/externaldb.toml -c /root/etc/chain33.toml &

  jrpc: # 浏览器项目使用（jrpcHost 默认 0.0.0.0:9993）
    container_name: externaldb-jrpc
    image: docker.io/ubuntu:16.04 
    volumes:
      - "./bin/:/root/bin/"
      - "./etc/:/root/etc/"
    network_mode: "host"
    command: /root/bin/jrpc -f /root/etc/externaldb.toml &

