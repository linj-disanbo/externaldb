version: '2'

# pull_convert（直连 pull + seq）部署模板：
#   pull_convert 取代 sync + convert 作为唯一写方（同一批索引不能两个写方并行）。
#   旧链路（sync + convert）保留在文件末尾并已注释，用于回退。
services:
  pull_convert:
    container_name: ${PROJECT_NAME}-pull-convert
    image: docker.io/ubuntu:16.04
    volumes:
      - ./bin/:/root/bin/
      - ./etc/:/root/etc/
    network_mode: "host"
    # -c 必须给完整 chain33 配置：v1.72 起 fork 严格校验，缺失即 panic
    command: /root/bin/pull_convert -f /root/etc/externaldb.toml -c /root/etc/chain33.toml &

  rpc: # 存证项目使用
    container_name: ${PROJECT_NAME}-rpc
    image: docker.io/ubuntu:16.04
    volumes:
      - ./bin/:/root/bin/
      - ./etc/:/root/etc/
      - ./etc/mime.type:/etc/mime.types # 用于处理文件后缀
    network_mode: "host"
    command: /root/bin/rpc -f /root/etc/externaldb.toml &

  jrpc: # 浏览器项目使用
    container_name: ${PROJECT_NAME}-jrpc
    image: docker.io/ubuntu:16.04
    volumes:
      - ./bin/:/root/bin/
      - ./etc/:/root/etc/
    network_mode: "host"
    command: /root/bin/jrpc -f /root/etc/externaldb.toml &

  # ---- 回退用（默认不启动）：老链路 sync + convert ----
