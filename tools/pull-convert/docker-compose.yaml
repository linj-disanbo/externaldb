version: '2'

# pull_convert（直连 pull + seq）部署模板：
#   pull_convert 是唯一写方（同一批索引不能有两个写方）。
#   jrpc 供浏览器/查询使用；rpc（gin REST）与老链路 sync/convert 不在本包里。
services:
  pull_convert:
    container_name: ${PROJECT_NAME}-pull-convert
    image: docker.io/ubuntu:16.04
    volumes:
      - ./bin/:/root/bin/
      - ./etc/:/root/etc/
    network_mode: "host"
    # -c 必须给完整 chain33 配置：v1.72 起 fork 严格校验，缺失即 panic
    command: /root/bin/pull_convert -f /root/etc/externaldb.toml -c /root/etc/chain33.toml &

  jrpc: # 浏览器/查询使用
    container_name: ${PROJECT_NAME}-jrpc
    image: docker.io/ubuntu:16.04
    volumes:
      - ./bin/:/root/bin/
      - ./etc/:/root/etc/
    network_mode: "host"
    command: /root/bin/jrpc -f /root/etc/externaldb.toml &
