version: '2'

# 直连（pull + seq）部署模板，4 个程序：
#   convert  —— 唯一写方：按 seq 从 chain33 拉块并展开写入 ES（同一批索引不能有两个写方）
#   jrpc     —— 浏览器/查询：读 ES
#   scanner  —— ERC20 扫块：按 seq 拉块解析转账写入 MySQL
#   erc20api —— ERC20 查询：读 MySQL（/evmapi/*）
#   accountrefresh —— 主币余额定时校正：按地址查链上 balance/frozen 写回 ES account 文档
# scanner / erc20api 依赖 [mysql]（MYSQL_ENABLED=true 时才启动，见 Makefile）。
# rpc（gin REST）与老链路 sync/convert 不在本包里。
services:
  convert:
    container_name: ${PROJECT_NAME}-convert
    image: docker.io/ubuntu:16.04
    working_dir: /root/bin
    volumes:
      - ./bin/:/root/bin/
      - ./etc/:/root/etc/
    network_mode: "host"
    # -c 必须给完整 chain33 配置：v1.72 起 fork 严格校验，缺失即 panic
    command: /root/bin/convert -f /root/etc/externaldb.toml -c /root/etc/chain33.toml &

  jrpc: # 浏览器/查询使用
    container_name: ${PROJECT_NAME}-jrpc
    image: docker.io/ubuntu:16.04
    working_dir: /root/bin
    volumes:
      - ./bin/:/root/bin/
      - ./etc/:/root/etc/
    network_mode: "host"
    command: /root/bin/jrpc -f /root/etc/externaldb.toml &

  scanner: # ERC20 扫块（写 MySQL，需要 [mysql] 启用）
    container_name: ${PROJECT_NAME}-scanner
    image: docker.io/ubuntu:16.04
    working_dir: /root/bin
    volumes:
      - ./bin/:/root/bin/
      - ./etc/:/root/etc/
    network_mode: "host"
    command: /root/bin/scanner -c /root/etc/externaldb.toml &

  erc20api: # ERC20 查询（读 MySQL，/evmapi/*）
    container_name: ${PROJECT_NAME}-erc20api
    image: docker.io/ubuntu:16.04
    working_dir: /root/bin
    volumes:
      - ./bin/:/root/bin/
      - ./etc/:/root/etc/
    network_mode: "host"
    command: /root/bin/erc20api -c /root/etc/externaldb.toml &

  accountrefresh: # 主币（BTY）余额定时校正（写 ES account 文档；[accountRefresh].enabled=false 时空转退出）
    container_name: ${PROJECT_NAME}-accountrefresh
    image: docker.io/ubuntu:16.04
    working_dir: /root/bin
    volumes:
      - ./bin/:/root/bin/
      - ./etc/:/root/etc/
    network_mode: "host"
    command: /root/bin/account_refresh -f /root/etc/externaldb.toml &
