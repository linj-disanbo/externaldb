version: '2'

# ES 7.17 模板（pkg-pullConvert 默认，env/es7 用这个）。
# 当前固定 7.17.29；如需其它补丁版改下面 image 一行即可。
# 镜像仓库用官方的 docker.elastic.co：Docker Hub 的 library/elasticsearch 没有 7.17.x 的 tag
# （报 `docker.io/library/elasticsearch:7.17.29: not found` 就是这个问题）。
# 若走私有镜像仓库/加速器，先拉再改 tag 推过去：
#   docker pull docker.elastic.co/elasticsearch/elasticsearch:7.17.29
#   docker tag  docker.elastic.co/elasticsearch/elasticsearch:7.17.29 <你的仓库>/elasticsearch:7.17.29
# 注意：7.17 需要宿主机 vm.max_map_count >= 262144（sysctl -w vm.max_map_count=262144）。
services:
  externaldb-es7: # Elasticsearch Instance
    container_name: ${ES_NAME}
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.29
    volumes: # Persist ES data in seperate "esdata" volume
      - ${ES_DIR}:/usr/share/elasticsearch/data
    environment:
      - bootstrap.memory_lock=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - discovery.type=single-node
      # 要启用密码，请将此项设为 true（7.x 默认不带安全模块）
      - "xpack.security.enabled=true"
      - ELASTIC_PASSWORD=${ES_PASSWORD}
    ports: # Expose Elasticsearch ports
      - ${ES_BIND}:${ES_PORT_HTTP}:9200
      - ${ES_BIND}:${ES_PORT_TCP}:9300
