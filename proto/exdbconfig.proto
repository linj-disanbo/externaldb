syntax = "proto3";
package proto;

import "convert.proto";
option go_package = "../proto";

message Chain33 {
  string title = 1;
  string grpcHost = 2;
  string host = 3;
  string symbol = 4;
  int64 otherChainGenesis = 5;
  int64 perBlockCoin = 6;
  repeated int64 rollbackSeq = 7;
  double coinPrecision = 8;
  double perTicketReward = 9;
}

message Kafka {
  string host = 1;
  string group = 2;
  string topic = 3;
}

message ESDB {
  string host = 2;
  string prefix = 3;
  bool bulk = 4;
  string user = 5;
  string pwd = 6;
}

message ESIndex {
  int32 numberOfShards = 1;
  int32 numberOfReplicas = 2;
}

message RPC {
  string host = 1;
  repeated string whiteList = 2;
  string swaggerHost = 3;
  string name = 4;
  double triggerCount = 5;

  bool enableSwagger = 6;
  string jrpcHost = 7;
  string jrpcName = 8;
}

message Sync {
  string name = 9;

  // pushBind 和 host 不一样， 在于云上， 外网ip 不可以bind
  string pushHost = 1; // 外网ip
  string pushName = 2;
  string pushBind = 3; // 本地

  // 同步开始位置, 如果收到之前的, 忽略. (老版本的chain33, 会从0开始同步,
  // 不能指定开始)
  int64 startSeq = 4;
  int64 startHeight = 5;
  string startBlockHash = 6;
  // 指定推送格式,
  string pushFormat = 11;
}

message Convert {
  string appName = 1;
  repeated string execAddresses = 5;
  int64 startSeq = 9;
  repeated ExecConfig data = 10;
  repeated StatConfig stat = 11;
  // 默认的处理插件
  string defaultExec = 12;
  // 是否处理非本链数据
  bool dealOtherChain = 13;
  // 是否开启权限控制
  bool openAccessControl = 14;
  bool saveBlockInfo = 15;
  string addressDriver = 16;
  // 直连（pull + seq）单批拉取的 seq 数，0 用默认 100（chain33 上限 999）
  int64 pullBatch = 17;
  // 直连追平链尖后的轮询间隔（毫秒），0 用默认 1000
  int64 pullPollMs = 18;
  // 回滚用的最近区块 detail 缓存条数，0 用默认 1000
  int64 pullDetailCache = 19;
  // seq_marker 保留窗口（条数），0 表示不滚动删除（保守默认，线上按需设置）
  int64 pullMarkerKeep = 20;
}

message MySQL {
  string dsn = 1;  // MySQL连接字符串，格式: user:password@tcp(host:port)/dbname?charset=utf8mb4&parseTime=True&loc=Local
  bool enabled = 2;  // 是否启用MySQL
}

// ERC20 数据（erc20scan 扫块 + erc20api 查询）的配置
message ERC20Scan {
  // eth JSON-RPC 地址（node 模式扫块、链上 balanceOf 校准都要用）
  string ethUrl = 1;
  // 扫块起点；0 表示从已存进度/链上起点继续
  int64 startBlock = 2;
  // 扫块终点；-1 表示跟随链尖
  int64 endBlock = 3;
  // 为 true 时不调用链上 balanceOf，仅写占位行，由 balanceRefresher 刷新
  bool skipInlineBalanceUpdate = 4;
  // erc20api 监听端口（仅端口，绑定 0.0.0.0）
  string apiPort = 5;
  BalanceRefresher balanceRefresher = 6;
  Log log = 7;
}

// ERC20 地址余额后台刷新（链上 balanceOf）
message BalanceRefresher {
  bool enabled = 1;
  string interval = 2;    // 如 1h、30m；空则默认 1h
  int32 batchSize = 3;    // 每轮最多行数，<=0 默认 50
  int32 concurrency = 4;  // 并发 RPC 上限，<=0 默认 5
  string minAge = 5;      // 只刷新超过该时间未更新的行，如 30s；空表示不限制
}

message Log {
  string level = 1;
  string file = 2;
  int32 maxSize = 3;
  int32 maxBackups = 4;
  int32 maxAge = 5;
}

message ConfigNew {

  // 处理的是哪条链 bityuan 或 user.p.xxxx.
  // Chain 依赖的chain33节点jsonrpc地址
  Chain33 chain = 1;

  // 同步和展开的数据库
  string dbtype = 2;
  int32 es_version = 10;
  ESDB sync_es = 3;
  ESDB convert_es = 4;
  Sync sync = 5;
  ESIndex es_index = 6;
  RPC rpc = 7;
  Convert convert = 8;
  Kafka kafka = 9;
  repeated string manager_address = 11;
  repeated Contract Contracts = 12;
  MySQL mysql = 13;  // MySQL数据库配置
  ERC20Scan erc20scan = 14;  // ERC20 扫块/查询配置
}

message Contract {
  string Abi = 1;
  string Bin = 2;
  string type = 3;
}
