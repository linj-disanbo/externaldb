version: '2'

# 镜像部署版 compose：适用于用 docker 镜像（chain33/externaldb/*）而非解包二进制的方式。
# 二进制部署走 deploy/pkg（make pkg 产物），两者不要混用。
# ES 固定 7.17（与 deploy/env/es7 一致）：7.17 需要宿主机 vm.max_map_count >= 262144。
# 堆按机器内存调，建议不超过内存一半、最多 ~31g。
services:
  externaldb-es7:
    container_name: ${ES_NAME}
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.29
    volumes:
      - ${ES_DIR}:/usr/share/elasticsearch/data
    environment:
      - bootstrap.memory_lock=false
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
      - discovery.type=single-node
      - "xpack.security.enabled=true"
      - ELASTIC_PASSWORD=${ES_PASSWORD}
    ports:
      - ${ES_BIND}:${ES_PORT_HTTP}:9200
      - ${ES_BIND}:${ES_PORT_TCP}:9300

  sync:
    container_name: ${PROJECT_NAME}-sync
    image: chain33/externaldb/sync:latest
    depends_on:
      - externaldb-es7
    volumes:
      - ./etc/:/root/etc/
    network_mode: "host"
    command: /root/sync -f /root/etc/externaldb.toml &

  convert:
    container_name: ${PROJECT_NAME}-convert
    image: chain33/externaldb/convert:latest
    depends_on:
      - externaldb-es7
      - sync
    volumes:
      - ./etc/:/root/etc/
    network_mode: "host"
    command: /root/convert -f /root/etc/externaldb.toml -c /root/etc/chain33.toml &

  jrpc:
    container_name: ${PROJECT_NAME}-jrpc
    image: chain33/externaldb/jrpc:latest
    depends_on:
      - externaldb-es7
    volumes:
      - ./etc/:/root/etc/
    network_mode: "host"
    command: /root/jrpc -f /root/etc/externaldb.toml &
