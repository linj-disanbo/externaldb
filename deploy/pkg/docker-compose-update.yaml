version: '2'

services:
  convert-update:
    container_name: ${PROJECT_NAME}-convert-update
    image: docker.io/ubuntu:22.04
    volumes:
      - ./bin-update/:/root/bin/
      - ./etc/:/root/etc/
    network_mode: "host"
    command: /root/bin/convert -f /root/etc/externaldb-update.toml -c /root/etc/chain33.toml &
