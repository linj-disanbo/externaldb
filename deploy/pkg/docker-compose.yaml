version: '2'

# 四个程序都在这里声明；起哪些由 .env 的 EX_SERVICE_TYPE 决定（见 Makefile 的 SERVICES）：
#   proof -> sync convert rpc；browser -> sync convert jrpc；其它 -> 全部
services:
  sync:
    container_name: ${PROJECT_NAME}-sync
    image: docker.io/ubuntu:22.04
    volumes:
      - ./bin/:/root/bin/
      - ./etc/:/root/etc/
    network_mode: "host"
    command: /root/bin/sync -f /root/etc/externaldb.toml &

  convert:
    container_name: ${PROJECT_NAME}-convert
    image: docker.io/ubuntu:22.04
    depends_on:
      - sync
    volumes:
      - ./bin/:/root/bin/
      - ./etc/:/root/etc/
    network_mode: "host"
    command: /root/bin/convert -f /root/etc/externaldb.toml -c /root/etc/chain33.toml &

  rpc: # 存证项目使用
    container_name: ${PROJECT_NAME}-rpc
    image: docker.io/ubuntu:22.04
    volumes:
      - ./bin/:/root/bin/
      - ./etc/:/root/etc/
      - ./etc/mime.types:/etc/mime.types # 文件下载接口按后缀设置 Content-Type
    network_mode: "host"
    command: /root/bin/rpc -f /root/etc/externaldb.toml &

  jrpc: # 浏览器项目使用
    container_name: ${PROJECT_NAME}-jrpc
    image: docker.io/ubuntu:22.04
    volumes:
      - ./bin/:/root/bin/
      - ./etc/:/root/etc/
    network_mode: "host"
    command: /root/bin/jrpc -f /root/etc/externaldb.toml &
